<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social App</title>
    <link rel="stylesheet" href="assets/css/styles.css">
    <link rel="icon" href="assets/images/favicon.ico" type="image/x-icon">
</head>
<body>
    <!-- Loading overlay -->
    <div id="loading-overlay" class="loading-overlay hidden">
        <div class="spinner"></div>
    </div>

    <!-- Main App Container -->
    <div id="app-container">
        <!-- Header -->
        <header class="app-header">
            <div class="container">
                <div class="header-content">
                    <h1 class="app-title">Social App</h1>
                    <nav class="main-nav">
                        <ul id="nav-menu" class="nav-menu">
                            <li><a href="#" id="home-link" class="nav-link active">Home</a></li>
                            <li><a href="#" id="profile-link" class="nav-link">Profile</a></li>
                            <li><a href="#" id="secrets-link" class="nav-link">Secrets</a></li>
                        </ul>
                    </nav>
                    <div class="auth-buttons">
                        <button id="login-btn" class="btn btn-primary">Login</button>
                        <button id="signup-btn" class="btn btn-secondary">Sign Up</button>
                        <button id="logout-btn" class="btn btn-outline hidden">Logout</button>
                    </div>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <div class="container">
                <!-- Auth Forms -->
                <section id="auth-section" class="auth-section hidden">
                    <div class="auth-form-container">
                        <div class="form-tabs">
                            <button id="show-login" class="tab-btn active">Login</button>
                            <button id="show-signup" class="tab-btn">Sign Up</button>
                        </div>
                        
                        <!-- Login Form -->
                        <form id="login-form" class="auth-form">
                            <h2>Login to Your Account</h2>
                            <div class="form-group">
                                <label for="login-email">Email:</label>
                                <input type="email" id="login-email" required>
                            </div>
                            <div class="form-group">
                                <label for="login-password">Password:</label>
                                <input type="password" id="login-password" required>
                            </div>
                            <button type="submit" class="btn btn-primary full-width">Login</button>
                            <div class="form-footer">
                                <button type="button" id="google-login" class="btn btn-google full-width">
                                    <span class="google-icon">G</span> Continue with Google
                                </button>
                            </div>
                        </form>

                        <!-- Signup Form -->
                        <form id="signup-form" class="auth-form hidden">
                            <h2>Create New Account</h2>
                            <div class="form-group">
                                <label for="signup-name">Full Name:</label>
                                <input type="text" id="signup-name" required>
                            </div>
                            <div class="form-group">
                                <label for="signup-email">Email:</label>
                                <input type="email" id="signup-email" required>
                            </div>
                            <div class="form-group">
                                <label for="signup-password">Password:</label>
                                <input type="password" id="signup-password" required minlength="6">
                            </div>
                            <div class="form-group">
                                <label for="signup-confirm">Confirm Password:</label>
                                <input type="password" id="signup-confirm" required>
                            </div>
                            <button type="submit" class="btn btn-primary full-width">Sign Up</button>
                        </form>
                    </div>
                </section>

                <!-- Feed Section -->
                <section id="feed-section" class="feed-section">
                    <div class="feed-header">
                        <h2>Latest Secrets</h2>
                        <button id="create-secret-btn" class="btn btn-primary">Share a Secret</button>
                    </div>
                    
                    <div id="secrets-container" class="secrets-container">
                        <!-- Secrets will be loaded here dynamically -->
                        <div class="secret-placeholder">
                            <p>No secrets yet. Be the first to share!</p>
                        </div>
                    </div>
                </section>

                <!-- Profile Section -->
                <section id="profile-section" class="profile-section hidden">
                    <div class="profile-header">
                        <div class="profile-avatar">
                            <img id="profile-image" src="assets/images/placeholder.jpg" alt="Profile Image">
                        </div>
                        <div class="profile-info">
                            <h2 id="profile-name">User Name</h2>
                            <p id="profile-email">user@example.com</p>
                        </div>
                    </div>
                    
                    <div class="profile-content">
                        <h3>Your Secrets</h3>
                        <div id="user-secrets" class="user-secrets">
                            <!-- User secrets will be loaded here -->
                        </div>
                    </div>
                </section>

                <!-- Create Secret Modal -->
                <div id="secret-modal" class="modal hidden">
                    <div class="modal-content">
                        <span class="close">&times;</span>
                        <h2>Share Your Secret</h2>
                        <form id="secret-form">
                            <div class="form-group">
                                <label for="secret-content">Your Secret:</label>
                                <textarea id="secret-content" rows="4" placeholder="What's your secret?" required></textarea>
                            </div>
                            <div class="form-actions">
                                <button type="button" class="btn btn-outline modal-cancel">Cancel</button>
                                <button type="submit" class="btn btn-primary">Share Secret</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </main>

        <!-- Footer -->
        <footer class="app-footer">
            <div class="container">
                <p>&copy; 2023 Social App. All rights reserved.</p>
            </div>
        </footer>
    </div>

    <!-- Toast Notifications -->
    <div id="toast-container" class="toast-container"></div>

    <!-- Firebase SDK -->
    <script type="module" src="assets/js/firebase-config.js"></script>
    <script type="module" src="assets/js/app.js"></script>
</body>
</html>
